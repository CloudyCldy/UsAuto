<div class="mb-3"><input class="form-control" type="text" name="nombre" placeholder="Nombre" required></div>
<div class="row g-2">
  <div class="col"><input class="form-control" type="text" name="apellido_paterno" placeholder="Apellido paterno"></div>
  <div class="col"><input class="form-control" type="text" name="apellido_materno" placeholder="Apellido materno"></div>
</div>
<div class="mb-3 mt-3"><input class="form-control" type="email" name="email" placeholder="Correo electrónico" required></div>
<div class="row g-2">
  <div class="col"><input class="form-control" type="tel" name="telefono" placeholder="Teléfono"></div>
  <div class="col"><input class="form-control" type="number" name="edad" min="18" placeholder="Edad"></div>
</div>
<div class="row g-2 mt-1">
  <div class="col"><input class="form-control" type="number" step="0.01" min="0" name="ingreso_mensual" placeholder="Ingreso mensual"></div>
  <div class="col"><input class="form-control" type="number" step="0.01" min="0" name="presupuesto" placeholder="Presupuesto"></div>
</div>
<div class="mt-3">
  <select class="form-select" name="tipo_cliente">
    <option value="Nuevo">Nuevo</option>
    <option value="Frecuente">Frecuente</option>
    <option value="VIP">VIP</option>
    <option value="Empresarial">Empresarial</option>
  </select>
</div>

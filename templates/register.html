{% extends 'auth_base.html' %}
{% block auth_content %}
<p class="eyebrow">Nueva cuenta</p>
<h1 class="auth-title">Crear cuenta</h1>
<p class="auth-subtitle">Registra un usuario para acceder al sistema.</p>
<form method="post" class="auth-form">
    <label for="nombre">Nombre</label>
    <input id="nombre" class="form-control" type="text" name="nombre" autocomplete="name" required autofocus>
    <label for="username">Usuario</label>
    <input id="username" class="form-control" type="text" name="username" autocomplete="username" required>
    <label for="email">Correo electrónico</label>
    <input id="email" class="form-control" type="email" name="email" autocomplete="email" required>
    <label for="password">Contraseña</label>
    <input id="password" class="form-control" type="password" name="password" minlength="8" autocomplete="new-password" required>
    <label for="password_confirmation">Confirmar contraseña</label>
    <input id="password_confirmation" class="form-control" type="password" name="password_confirmation" minlength="8" autocomplete="new-password" required>
    <button class="btn btn-primary w-100" type="submit">Registrarme</button>
</form>
<p class="auth-link">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Iniciar sesión</a></p>
{% endblock %}

{% extends 'auth_base.html' %}
{% block auth_content %}
<p class="eyebrow">Acceso seguro</p>
<h1 class="auth-title">Iniciar sesión</h1>
<p class="auth-subtitle">Ingresa para administrar tu agencia.</p>
<form method="post" class="auth-form">
    <input type="hidden" name="next" value="{{ next_url }}">
    <label for="identifier">Usuario o correo</label>
    <input id="identifier" class="form-control" type="text" name="identifier" autocomplete="username" required autofocus>
    <label for="password">Contraseña</label>
    <input id="password" class="form-control" type="password" name="password" autocomplete="current-password" required>
    <button class="btn btn-primary w-100" type="submit">Entrar</button>
</form>
<p class="auth-link">¿No tienes cuenta? <a href="{{ url_for('register') }}">Crear cuenta</a></p>
{% endblock %}
